name: Add bonus ball

on:
  push:
    paths:
      - '.github/workflows/add-bonus-ball.yml'

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore native game and add bonus balls
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          native = subprocess.check_output(['git','show','c15b6f0cbcbd48a14d207dbac2ce709b1d479205:components/fury-ring.native.tsx'], text=True)
          web = Path('components/fury-ring.web.tsx').read_text()

          def patch(s):
              s = s.replace('const BOMB_MAX_INTERVAL_MS = 14000;\n', 'const BOMB_MAX_INTERVAL_MS = 14000;\nconst BONUS_BALL_CHANCE = 0.06;\nconst SPECIAL_BALL_BONUS = 10;\n')
              s = s.replace('type ProjectileKind = "ball" | "bomb";', 'type ProjectileKind = "ball" | "bomb" | "bonus";')
              s = s.replace('const slow = kind === "ball" && Math.random() < SLOW_BALL_CHANCE;', 'const slow = kind === "ball" && Math.random() < SLOW_BALL_CHANCE;')
              old = 'const ball = createProjectile(nextBallIdRef.current, windowWidth, windowHeight, difficulty, "ball");\n        nextBallIdRef.current += 1;\n        return [...currentBalls, ball];'
              new = 'const kind: ProjectileKind = Math.random() < BONUS_BALL_CHANCE ? "bonus" : "ball";\n        const ball = createProjectile(nextBallIdRef.current, windowWidth, windowHeight, difficulty, kind);\n        nextBallIdRef.current += 1;\n        return [...currentBalls, ball];'
              s = s.replace(old, new)
              marker = '  if (ball.kind === "bomb") {'
              bonus_view = '''  if (ball.kind === "bonus") {\n    return (\n      <Animated.View\n        pointerEvents="none"\n        style={[styles.bonusBall, { transform: [{ translateX }, { translateY }] }]}\n      >\n        <Text style={styles.bonusBallText}>10</Text>\n      </Animated.View>\n    );\n  }\n\n'''
              s = s.replace(marker, bonus_view + marker)
              old_handle = '''    removeBall(id);\n    setBonusPoints((current) => current + EATEN_BALL_BONUS);\n    showBonusFeedback();'''
              new_handle = '''    removeBall(id);\n    const points = kind === "bonus" ? SPECIAL_BALL_BONUS : EATEN_BALL_BONUS;\n    setBonusPoints((current) => current + points);\n    showBonusFeedback(points);'''
              s = s.replace(old_handle, new_handle)
              s = s.replace('const showBonusFeedback = useCallback(() => {', 'const bonusFeedbackPointsRef = useRef(EATEN_BALL_BONUS);\n\n  const showBonusFeedback = useCallback((points = EATEN_BALL_BONUS) => {\n    bonusFeedbackPointsRef.current = points;')
              s = s.replace('+{EATEN_BALL_BONUS}\n        </Animated.Text>', '+{bonusFeedbackPointsRef.current}\n        </Animated.Text>')
              style_marker = '  bomb: {\n'
              bonus_style = '''  bonusBall: {\n    position: "absolute",\n    left: "50%",\n    top: "50%",\n    width: 16,\n    height: 16,\n    marginLeft: -8,\n    marginTop: -8,\n    borderRadius: 8,\n    alignItems: "center",\n    justifyContent: "center",\n    backgroundColor: "#FFD166",\n    borderWidth: 2,\n    borderColor: "#FFF4C2",\n  },\n  bonusBallText: {\n    color: "#3A2500",\n    fontSize: 8,\n    lineHeight: 10,\n    fontWeight: "900",\n  },\n'''
              s = s.replace(style_marker, bonus_style + style_marker)
              return s

          Path('components/fury-ring.native.tsx').write_text(patch(native))
          Path('components/fury-ring.web.tsx').write_text(patch(web))
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/fury-ring.native.tsx components/fury-ring.web.tsx
          git commit -m "Add +10 bonus balls" || exit 0
          git push
